<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ART SPACE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gallery-charcoal: #2c2c2c;
            --gallery-muted: #6b7280;
            --gallery-bg: #f8f9fa;
            --gallery-gray: #e5e7eb;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--gallery-charcoal);
            background: linear-gradient(135deg, #f8f9fa 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .login-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            padding: 2.5rem 2rem 2rem;
            background: var(--gallery-charcoal);
            color: var(--white);
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--gallery-gray);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            background: var(--white);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: var(--gallery-muted);
            transition: all 0.3s ease;
            position: relative;
        }

        .tab:hover {
            color: var(--gallery-charcoal);
            background: var(--gallery-bg);
        }

        .tab.active {
            color: var(--gallery-charcoal);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gallery-charcoal);
        }

        .form-container {
            padding: 2rem;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--gallery-charcoal);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--gallery-gray);
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--gallery-charcoal);
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--gallery-charcoal);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:disabled {
            background: var(--gallery-muted);
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 6px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--gallery-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--gallery-charcoal);
        }

        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="font-serif">ART SPACE</h1>
            <p>Welcome back to art and inspiration</p>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="login" data-testid="tab-login">Login</button>
            <button class="tab" data-tab="register" data-testid="tab-register">Register</button>
        </div>

        <div class="form-container">
            <div id="login-form" class="form-content active">
                <div class="message" id="login-message"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required
                            data-testid="input-login-username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required
                            data-testid="input-login-password">
                    </div>
                    <button type="submit" class="submit-btn" data-testid="button-login-submit">Login</button>
                </form>
            </div>

            <div id="register-form" class="form-content">
                <div class="message" id="register-message"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" required
                            data-testid="input-register-username">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" required minlength="6"
                            data-testid="input-register-password">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input type="password" id="register-confirm-password" name="confirmPassword" required
                            minlength="6" data-testid="input-register-confirm-password">
                    </div>
                    <button type="submit" class="submit-btn" data-testid="button-register-submit">Register</button>
                </form>
            </div>

            <div class="back-link">
                <a href="/" data-testid="link-back-gallery">← Back to Gallery</a>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const formContents = document.querySelectorAll('.form-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');

                tabs.forEach(t => t.classList.remove('active'));
                formContents.forEach(fc => fc.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(`${tabName}-form`).classList.add('active');

                hideMessages();
            });
        });

        function showMessage(formType, message, isSuccess) {
            const messageEl = document.getElementById(`${formType}-message`);
            messageEl.textContent = message;
            messageEl.className = `message show ${isSuccess ? 'success' : 'error'}`;
        }

        function hideMessages() {
            document.querySelectorAll('.message').forEach(msg => {
                msg.classList.remove('show');
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const submitBtn = e.target.querySelector('.submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            hideMessages();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('login', 'Login successful! Redirecting...', true);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage('login', data.message || 'Login failed', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            } catch (error) {
                showMessage('login', 'An error occurred. Please try again.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const submitBtn = e.target.querySelector('.submit-btn');

            hideMessages();

            if (password !== confirmPassword) {
                showMessage('register', 'Passwords do not match', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('register', 'Registration successful! Redirecting...', true);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage('register', data.message || 'Registration failed', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register';
                }
            } catch (error) {
                showMessage('register', 'An error occurred. Please try again.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const submitBtn = e.target.querySelector('.submit-btn');

            hideMessages();

            if (password !== confirmPassword) {
                showMessage('register', 'Passwords do not match', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('register', 'Registration successful! Redirecting...', true);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage('register', data.message || 'Registration failed', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register';
                }
            }  catch (error) {
                showMessage('register', 'An error occurred. Please try again.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });
    </script>
</body>

</html>
